<!-- @dsCard group="Badges" -->
<div style="background:#fafaf9; color:#1a1a1a; padding:32px; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif;">
  <style>
    .ds-title { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #737373; margin: 0 0 16px; }
    .ds-row { display: flex; align-items: center; gap: 24px; }
    .ds-item { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    .ds-name { font-size: 11px; color: #a3a3a3; font-family: ui-monospace, monospace; }

    .badge { display:inline-flex; align-items:center; border-radius:9999px; padding:4px 12px; font-size:12px; font-weight:500; }
    .badge-default { background:#f5f5f5; color:#404040; }
    .badge-primary { background:#f0e6d8; color:#604828; }
    .badge-secondary { background:#262626; color:#fff; }
    .badge-outline { background:transparent; color:#525252; border:1px solid #d4d4d4; }
  </style>

  <p class="ds-title">Variants</p>
  <div class="ds-row">
    <div class="ds-item"><span class="badge badge-default">Realizzato</span><span class="ds-name">default</span></div>
    <div class="ds-item"><span class="badge badge-primary">Cucine</span><span class="ds-name">primary</span></div>
    <div class="ds-item"><span class="badge badge-secondary">Privato</span><span class="ds-name">secondary</span></div>
    <div class="ds-item"><span class="badge badge-outline">Bagni</span><span class="ds-name">outline</span></div>
  </div>
</div>
